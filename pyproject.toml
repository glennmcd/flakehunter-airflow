[project]
name = "flakehunter-airflow"
version = "0.1.0"
description = "Airflow DAGs that feed GitHub Actions JUnit results into FlakeHunter"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "attrs>=23.2",
    "python-dateutil>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
    "openapi-python-client>=0.29,<0.30",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared", "src/flakehunter_ingest_github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/shared/_api"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
